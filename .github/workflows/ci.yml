name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        laravel: ["^13.0", "^12.0", "^11.0"]
        dependency-version: [prefer-stable, prefer-lowest]
        exclude:
          - php: "8.5"
            laravel: "^11.0"
          - php: "8.2"
            laravel: "^13.0"

    name: Laravel ${{ matrix.laravel }} | PHP ${{ matrix.php }} | ${{ matrix.dependency-version }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: admin
          MYSQL_DATABASE: fast_api_crud
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -padmin"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, zip, bcmath, curl, json, fileinfo
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.composer/cache/files
            ~/.cache/composer/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Laravel + Testbench
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-update --no-interaction
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

      - name: Run Tests
        run: vendor/bin/pest
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: fast_api_crud
          DB_USERNAME: root
          DB_PASSWORD: admin
