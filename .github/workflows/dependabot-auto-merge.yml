name: Dependabot auto-merge

# Runs after CI finishes on a Dependabot PR and merges it if CI passed.
# Patch and minor updates only; major updates are left open for manual review.
#
# Merging here (instead of `gh pr merge --auto`) avoids needing branch
# protection with required status checks on the default branch.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    steps:
      - name: Merge patch/minor Dependabot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(gh pr list -R "$REPO" --head "$BRANCH" --author app/dependabot --json number -q '.[0].number')
          if [ -z "$pr" ]; then
            echo "No open Dependabot PR for $BRANCH"
            exit 0
          fi

          # Dependabot records the update type of each dependency in the commit message.
          msg=$(gh api "repos/$REPO/commits/$SHA" -q .commit.message)
          if ! grep -q 'update-type: version-update:semver-' <<<"$msg"; then
            echo "No update-type metadata in commit; leaving PR #$pr for manual review"
            exit 0
          fi
          if grep -q 'update-type: version-update:semver-major' <<<"$msg"; then
            echo "Major update; leaving PR #$pr for manual review"
            exit 0
          fi

          gh pr merge "$pr" -R "$REPO" --squash --match-head-commit "$SHA"
